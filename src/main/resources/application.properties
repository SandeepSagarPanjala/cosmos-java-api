spring.application.name=cosmos-java-api

# Optional: lazy-init for the whole app (all beans default to first-use creation). Most teams leave this off
# so wiring/config errors fail at startup. Uncomment only if you understand the tradeoff.
# spring.main.lazy-initialization=true

# RFC 7807 problem+json for ProblemDetail responses from @ExceptionHandler
spring.mvc.problemdetails.enabled=true

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/Roadmap
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
